[project]
name = "re-harmony"
version = "0.1.0"
description = "Configure a Logitech Harmony One without Logitech's servers"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "keyring>=25",
  "pywebview>=5",
]

# Those two are the whole list, and that is the point. The client that talks
# to Logitech's cloud used to be a separate package that was never published
# -- a hard dependency here, so `uv sync` failed and there was no app at all;
# and once it was made optional, the Catalog screen imported fine and then
# raised the moment somebody pressed Search. It is not a dependency any more:
# `app/catalog_client.py` does the same four read-only calls on
# `urllib.request` from the standard library. `httpx` went with it.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
